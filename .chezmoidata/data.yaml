theme:
  colors:
    primary:
      hex: "6e90b0"
      rgb: "110, 144, 176"
    accent:
      hex: "7fbfb4"
      rgb: "127, 191, 180"
    bg_dark:
      hex: "161719"
      rgb: "22, 23, 25"
    bg_medium:
      hex: "1e1f22"
      rgb: "30, 31, 34"
    bg_light:
      hex: "2a2e33"
      rgb: "42, 46, 51"
    surface:
      hex: "434548"
      rgb: "67, 69, 72"
    # 補助テキスト。bg_dark 上で 4.9:1 (WCAG AA)。旧値 5a626a は 2.9:1 で基準に届かず、
    # 色相を保って明度だけ上げた (rofi の fg-dim と同じ値。2026-11 の UI 見直し)
    text_dim:
      hex: "7d8791"
      rgb: "125, 135, 145"
    text:
      hex: "b7bcba"
      rgb: "183, 188, 186"
    warning:
      hex: "e4b55e"
      rgb: "228, 181, 94"
    error:
      hex: "b84d51"
      rgb: "184, 77, 81"
    # 文字に使う赤。error は bg_medium 上で 3.3:1 しかないので、色相を保って明るくし 5.1:1 にした
    error_text:
      hex: "c9797c"
      rgb: "201, 121, 124"
    success:
      hex: "b3bf5a"
      rgb: "179, 191, 90"
    warning_alt:
      hex: "e58a50"
      rgb: "229, 138, 80"
  # Gruvbox Material (medium background, material foreground) - used on darwin
  colors_darwin:
    primary:
      hex: "7daea3"
      rgb: "125, 174, 163"
    accent:
      hex: "89b482"
      rgb: "137, 180, 130"
    bg_dark:
      hex: "282828"
      rgb: "40, 40, 40"
    bg_medium:
      hex: "32302f"
      rgb: "50, 48, 47"
    bg_light:
      hex: "45403d"
      rgb: "69, 64, 61"
    surface:
      hex: "5a524c"
      rgb: "90, 82, 76"
    text_dim:
      hex: "928374"
      rgb: "146, 131, 116"
    text:
      hex: "d4be98"
      rgb: "212, 190, 152"
    warning:
      hex: "d8a657"
      rgb: "216, 166, 87"
    error:
      hex: "ea6962"
      rgb: "234, 105, 98"
    success:
      hex: "a9b665"
      rgb: "169, 182, 101"
    warning_alt:
      hex: "e78a4e"
      rgb: "231, 138, 78"
  # Catppuccin Mocha - fp7-e14 専用。am5(青hybrid)/mac(緑gruvbox)と色相が被らない
  # 紫基調。CIEDE2000 で既存占有色から最大の知覚距離(min ΔE>20)を確認して採用。
  colors_catppuccin:
    primary:
      hex: "cba6f7"
      rgb: "203, 166, 247"
    accent:
      hex: "f5c2e7"
      rgb: "245, 194, 231"
    bg_dark:
      hex: "181825"
      rgb: "24, 24, 37"
    bg_medium:
      hex: "1e1e2e"
      rgb: "30, 30, 46"
    bg_light:
      hex: "313244"
      rgb: "49, 50, 68"
    surface:
      hex: "45475a"
      rgb: "69, 71, 90"
    text_dim:
      hex: "7f849c"
      rgb: "127, 132, 156"
    text:
      hex: "cdd6f4"
      rgb: "205, 214, 244"
    warning:
      hex: "f9e2af"
      rgb: "249, 226, 175"
    error:
      hex: "f38ba8"
      rgb: "243, 139, 168"
    error_text:
      hex: "f38ba8"
      rgb: "243, 139, 168"
    success:
      hex: "a6e3a1"
      rgb: "166, 227, 161"
    warning_alt:
      hex: "fab387"
      rgb: "250, 179, 135"
  # 形の体系。角丸は 3 段 (小: ボタン・ワークスペース番号 / 中: ウィンドウ・通知・入力欄 /
  # 大: バーの島・ランチャー・通知センター)。ウィンドウの角丸は端末の角の文字を欠かない 6 以下にする。
  # gap は画面端・バーの外側の余白で、ウィンドウどうしの間 (gaps_in の 2 倍) も同じ値にそろえる。
  shape:
    radius_sm: 4
    radius_md: 6
    radius_lg: 8
    gap: 8
  fonts:
    ui: "IBM Plex Sans JP"
    terminal: "UDEV Gothic 35NFLG"
    mono: "UDEV Gothic 35NFLG"

  gtk_theme:
    dark: "Adwaita-dark"
    light: "Adwaita-dark"
    icon_dark: "Adwaita"
    icon_light: "Adwaita"

location:
  lat: 35.6762
  lon: 139.6503

color_temp:
  day: 6500
  night: 3000

browser_flags: "--enable-features=UseOzonePlatform --ozone-platform=wayland --gtk-version=4 --enable-wayland-ime --password-store=basic --disable-background-mode --pwa-flags-conf-debug=1"

electron_flags:
  - "--enable-features=UseOzonePlatform"
  - "--ozone-platform=wayland"
  - "--enable-wayland-ime"
  - "--wayland-text-input-version=3"
  - "--password-store=basic"
