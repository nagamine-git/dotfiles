#!/usr/bin/env python3
# ~/.codex/config.toml の modify_ スクリプト (stdin=現在の内容 → stdout=新しい内容)。
# Codex 自身が projects / tui 等を書き込むため丸ごとは管理せず、次だけ補う:
#   - トップレベル           model_reasoning_effort が無ければ "medium"
#   - [profiles.deep] テーブル model_reasoning_effort が無ければ "xhigh"
#   - トップレベル           project_doc_fallback_filenames に "CLAUDE.md" を含める
#                            (AGENTS.md が無いリポジトリで CLAUDE.md を読ませる。他の名前は残す)
#   - Linux のトップレベル  mcp_oauth_credentials_store が無ければ "file" (keyring crash の回避)
# 他の行は一切変えない。stdin が空 (新ホスト) なら上の既定値だけを出力する。
# macOS 標準の python3 (3.9) でも動くよう標準ライブラリの行単位処理のみ (tomllib 不使用)。
import re
import sys

KEY = "model_reasoning_effort"
TOP_VALUE = "medium"
PROFILE = "profiles.deep"
PROFILE_VALUE = "xhigh"
FALLBACK_KEY = "project_doc_fallback_filenames"
FALLBACK_ITEM = "CLAUDE.md"
MCP_STORE_KEY = "mcp_oauth_credentials_store"

HEADER_RE = re.compile(r"""^\s*\[\[?\s*((?:"[^"]*"|'[^']*'|[^\[\]"'#])+?)\s*\]\]?\s*(#.*)?$""")
FALLBACK_RE = re.compile(r"^(\s*)%s\s*=\s*(.*)$" % FALLBACK_KEY)
STRING_RE = re.compile(r'"((?:[^"\\]|\\.)*)"' + r"|'([^']*)'")


def advance(line, ml, depth):
    """1 行ぶん読み進め、複数行文字列 (ml) と [] {} の深さを更新して返す。"""
    i, n = 0, len(line)
    while i < n:
        if ml == '"""':
            while i < n and not line.startswith('"""', i):
                i += 2 if line[i] == "\\" else 1
            if i >= n:
                return ml, depth
            ml, i = None, i + 3
            continue
        if ml == "'''":
            j = line.find("'''", i)
            if j < 0:
                return ml, depth
            ml, i = None, j + 3
            continue
        c = line[i]
        if c == "#":
            break
        if line.startswith('"""', i) or line.startswith("'''", i):
            ml, i = line[i:i + 3], i + 3
        elif c == '"':
            i += 1
            while i < n and line[i] != '"':
                i += 2 if line[i] == "\\" else 1
            i += 1
        elif c == "'":
            j = line.find("'", i + 1)
            i = n if j < 0 else j + 1
        else:
            if c in "[{":
                depth += 1
            elif c in "]}":
                depth -= 1
            i += 1
    return ml, depth


def scan(lines):
    """各行が「テーブル見出し」か「キー行になり得る行頭」かを判定する。
    複数行文字列・複数行配列の途中にある [ で始まる行を見出しと誤認しない。"""
    headers = {}  # 行番号 -> 正規化したテーブル名 (空白と引用符を除去)
    at_code = []  # 行頭が文字列・配列の外か
    ml, depth = None, 0
    for i, line in enumerate(lines):
        top = ml is None and depth == 0
        at_code.append(top)
        m = HEADER_RE.match(line) if top else None
        if m:
            headers[i] = re.sub(r'[\s"\']', "", m.group(1))
            continue
        ml, depth = advance(line, ml, depth)
    return headers, at_code


def is_code(line):
    s = line.strip()
    return bool(s) and not s.startswith("#")


def ensure_key(lines, start, end, value, at_code, key=KEY):
    """lines[start:end] (1 テーブルの本体) に key が無ければ value を追加する。
    既存行はそのまま残す。追加位置は本体の最後のコード行の後ろ。"""
    escaped = re.escape(key)
    pattern = re.compile(r"""^(\s*)(?:"%s"|'%s'|%s)\s*=\s*(.*)$""" % (escaped, escaped, escaped))
    new = '%s = "%s"' % (key, value)
    for i in range(start, end):
        m = pattern.match(lines[i]) if at_code[i] else None
        if not m:
            continue
        return
    insert_line(lines, start, end, new)


def insert_line(lines, start, end, new):
    """lines[start:end] (1 テーブルの本体) の最後のコード行の後ろに new を 1 行足す。"""
    at = start
    for i in range(end - 1, start - 1, -1):
        if is_code(lines[i]):
            at = i + 1
            break
    else:
        # コード行が無ければ末尾のコメント行の後ろ (全て空行なら本体の先頭)
        for i in range(end - 1, start - 1, -1):
            if lines[i].strip():
                at = i + 1
                break
    ins = [new]
    if at == end and end < len(lines):
        ins.append("")  # 直後が次の見出しなら空行で区切る
    lines[at:at] = ins


def array_end(rest):
    """rest は "[" で始まる値。対応する "]" の位置 (文字列内は無視)。閉じていなければ -1。"""
    i, n = 1, len(rest)
    while i < n:
        c = rest[i]
        if c == '"':
            i += 1
            while i < n and rest[i] != '"':
                i += 2 if rest[i] == "\\" else 1
        elif c == "'":
            j = rest.find("'", i + 1)
            if j < 0:
                return -1
            i = j
        elif c == "]":
            return i
        elif c == "#":
            return -1
        i += 1
    return -1


def ensure_fallback(lines, start, end, at_code):
    """lines[start:end] (トップレベル) の FALLBACK_KEY に FALLBACK_ITEM を含める。
    既存の他の名前は残す。1 行で閉じていない配列は壊さないよう触らず警告だけ出す。"""
    quoted = '"%s"' % FALLBACK_ITEM
    for i in range(start, end):
        m = FALLBACK_RE.match(lines[i]) if at_code[i] else None
        if not m:
            continue
        rest = m.group(2)
        close = array_end(rest) if rest.startswith("[") else -1
        if close < 0:
            sys.stderr.write("WARN: %s が 1 行の配列でないため %s を足せません\n" % (FALLBACK_KEY, FALLBACK_ITEM))
            return
        body = rest[1:close]
        if FALLBACK_ITEM in [a or b for a, b in STRING_RE.findall(body)]:
            return
        body = body.rstrip()
        if not body:
            body = quoted
        elif body.endswith(","):
            body += " " + quoted
        else:
            body += ", " + quoted
        lines[i] = "%s%s = [%s]%s" % (m.group(1), FALLBACK_KEY, body, rest[close + 1:])
        return
    insert_line(lines, start, end, "%s = [%s]" % (FALLBACK_KEY, quoted))


def main():
    text = sys.stdin.buffer.read().decode("utf-8")
    if not text.strip():
        defaults = ['%s = "%s"' % (KEY, TOP_VALUE), '%s = ["%s"]' % (FALLBACK_KEY, FALLBACK_ITEM)]
        if sys.platform.startswith("linux"):
            defaults.append('%s = "file"' % MCP_STORE_KEY)
        out = "\n".join(defaults + ["", '[%s]' % PROFILE, '%s = "%s"' % (KEY, PROFILE_VALUE)]) + "\n"
        sys.stdout.buffer.write(out.encode("utf-8"))
        return

    trailing_nl = text.endswith("\n")
    lines = text.split("\n")
    if trailing_nl:
        lines.pop()

    # プロファイルを先に処理する (トップレベルへの挿入で行番号がずれるため)
    headers, at_code = scan(lines)
    order = sorted(headers)
    deep = [i for i in order if headers[i] == PROFILE]
    if deep:
        s = deep[0]
        nxt = [i for i in order if i > s]
        ensure_key(lines, s + 1, nxt[0] if nxt else len(lines), PROFILE_VALUE, at_code)
    else:
        if lines and lines[-1].strip():
            lines.append("")
        lines += ["[%s]" % PROFILE, '%s = "%s"' % (KEY, PROFILE_VALUE)]

    headers, at_code = scan(lines)
    first = min(headers) if headers else len(lines)
    ensure_key(lines, 0, first, TOP_VALUE, at_code)

    headers, at_code = scan(lines)  # 行が増えた可能性があるので取り直す
    first = min(headers) if headers else len(lines)
    ensure_fallback(lines, 0, first, at_code)

    if sys.platform.startswith("linux"):
        headers, at_code = scan(lines)
        first = min(headers) if headers else len(lines)
        ensure_key(lines, 0, first, "file", at_code, MCP_STORE_KEY)

    out = "\n".join(lines) + "\n"
    if out.rstrip("\n") == text.rstrip("\n"):
        out = text  # 変更なし (末尾改行の有無も含め入力をそのまま返す)
    sys.stdout.buffer.write(out.encode("utf-8"))


if __name__ == "__main__":
    main()
