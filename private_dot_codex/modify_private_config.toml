#!/usr/bin/env python3
# ~/.codex/config.toml の modify_ スクリプト (stdin=現在の内容 → stdout=新しい内容)。
# Codex 自身が projects / tui 等を書き込むため丸ごとは管理せず、次の 2 つだけ強制する:
#   - トップレベル           model_reasoning_effort = "medium"
#   - [profiles.deep] テーブル model_reasoning_effort = "xhigh"
# 他の行は一切変えない。stdin が空 (新ホスト) なら上の 2 つだけを出力する。
# macOS 標準の python3 (3.9) でも動くよう標準ライブラリの行単位処理のみ (tomllib 不使用)。
import re
import sys

KEY = "model_reasoning_effort"
TOP_VALUE = "medium"
PROFILE = "profiles.deep"
PROFILE_VALUE = "xhigh"

HEADER_RE = re.compile(r"""^\s*\[\[?\s*((?:"[^"]*"|'[^']*'|[^\[\]"'#])+?)\s*\]\]?\s*(#.*)?$""")
KEY_RE = re.compile(r'^(\s*)(?:"%s"|%s)\s*=\s*(.*)$' % (KEY, KEY))
SIMPLE_VALUE_RE = re.compile(r"""^(?:"([^"\\]*)"|'([^']*)')\s*(#.*)?$""")


def advance(line, ml, depth):
    """1 行ぶん読み進め、複数行文字列 (ml) と [] {} の深さを更新して返す。"""
    i, n = 0, len(line)
    while i < n:
        if ml == '"""':
            while i < n and not line.startswith('"""', i):
                i += 2 if line[i] == "\\" else 1
            if i >= n:
                return ml, depth
            ml, i = None, i + 3
            continue
        if ml == "'''":
            j = line.find("'''", i)
            if j < 0:
                return ml, depth
            ml, i = None, j + 3
            continue
        c = line[i]
        if c == "#":
            break
        if line.startswith('"""', i) or line.startswith("'''", i):
            ml, i = line[i:i + 3], i + 3
        elif c == '"':
            i += 1
            while i < n and line[i] != '"':
                i += 2 if line[i] == "\\" else 1
            i += 1
        elif c == "'":
            j = line.find("'", i + 1)
            i = n if j < 0 else j + 1
        else:
            if c in "[{":
                depth += 1
            elif c in "]}":
                depth -= 1
            i += 1
    return ml, depth


def scan(lines):
    """各行が「テーブル見出し」か「キー行になり得る行頭」かを判定する。
    複数行文字列・複数行配列の途中にある [ で始まる行を見出しと誤認しない。"""
    headers = {}  # 行番号 -> 正規化したテーブル名 (空白と引用符を除去)
    at_code = []  # 行頭が文字列・配列の外か
    ml, depth = None, 0
    for i, line in enumerate(lines):
        top = ml is None and depth == 0
        at_code.append(top)
        m = HEADER_RE.match(line) if top else None
        if m:
            headers[i] = re.sub(r'[\s"\']', "", m.group(1))
            continue
        ml, depth = advance(line, ml, depth)
    return headers, at_code


def is_code(line):
    s = line.strip()
    return bool(s) and not s.startswith("#")


def set_key(lines, start, end, value, at_code):
    """lines[start:end] (1 テーブルの本体) の KEY を value に揃える。
    既存行があれば置換 (既に同値ならそのまま)、無ければ本体の最後のコード行の後ろに追加。"""
    new = '%s = "%s"' % (KEY, value)
    for i in range(start, end):
        m = KEY_RE.match(lines[i]) if at_code[i] else None
        if not m:
            continue
        v = SIMPLE_VALUE_RE.match(m.group(2).strip())
        if v and (v.group(1) if v.group(1) is not None else v.group(2)) == value:
            return
        comment = " " + v.group(3) if v and v.group(3) else ""
        lines[i] = m.group(1) + new + comment
        return
    at = start
    for i in range(end - 1, start - 1, -1):
        if is_code(lines[i]):
            at = i + 1
            break
    else:
        # コード行が無ければ末尾のコメント行の後ろ (全て空行なら本体の先頭)
        for i in range(end - 1, start - 1, -1):
            if lines[i].strip():
                at = i + 1
                break
    ins = [new]
    if at == end and end < len(lines):
        ins.append("")  # 直後が次の見出しなら空行で区切る
    lines[at:at] = ins


def main():
    text = sys.stdin.buffer.read().decode("utf-8")
    if not text.strip():
        out = '%s = "%s"\n\n[%s]\n%s = "%s"\n' % (KEY, TOP_VALUE, PROFILE, KEY, PROFILE_VALUE)
        sys.stdout.buffer.write(out.encode("utf-8"))
        return

    trailing_nl = text.endswith("\n")
    lines = text.split("\n")
    if trailing_nl:
        lines.pop()

    # プロファイルを先に処理する (トップレベルへの挿入で行番号がずれるため)
    headers, at_code = scan(lines)
    order = sorted(headers)
    deep = [i for i in order if headers[i] == PROFILE]
    if deep:
        s = deep[0]
        nxt = [i for i in order if i > s]
        set_key(lines, s + 1, nxt[0] if nxt else len(lines), PROFILE_VALUE, at_code)
    else:
        if lines and lines[-1].strip():
            lines.append("")
        lines += ["[%s]" % PROFILE, '%s = "%s"' % (KEY, PROFILE_VALUE)]

    headers, at_code = scan(lines)
    first = min(headers) if headers else len(lines)
    set_key(lines, 0, first, TOP_VALUE, at_code)

    out = "\n".join(lines) + "\n"
    if out.rstrip("\n") == text.rstrip("\n"):
        out = text  # 変更なし (末尾改行の有無も含め入力をそのまま返す)
    sys.stdout.buffer.write(out.encode("utf-8"))


if __name__ == "__main__":
    main()
