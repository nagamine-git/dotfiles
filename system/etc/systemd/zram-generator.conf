# zram swap (am5-itx)。zram0 16GB は 2026-08-29 から稼働中。
# 2026-09-06: 満杯 (14.4GB, 圧縮率1.6倍) のため zram1 を追加して合計 32GB にした。
# zram0 のサイズ変更は swapoff で 14GB を RAM に戻す必要があり OOM の危険があるので、
# 既存デバイスは触らず 2 台目を足す方式にしている (再起動不要・副作用なし)。
[zram0]
zram-size = 16384
compression-algorithm = zstd
swap-priority = 100

[zram1]
zram-size = 16384
compression-algorithm = zstd
swap-priority = 100
