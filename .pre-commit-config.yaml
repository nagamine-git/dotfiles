repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        # SC2329 (呼ばれない関数) は trap から呼ぶ関数を誤検出する (ShellCheck 0.11 で追加された規則)
        args: ["-e", "SC1091,SC2016,SC2155,SC2329"]
        exclude: '\.tmpl$'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # hazkey の .tsv は行末のタブが空の列を表すので消さない
      - id: trailing-whitespace
        exclude: '\.(md|tsv)$'
      # fcitx5 は設定を末尾の空行付きで書き戻すので、そろえると apply のたびに差分が出る
      - id: end-of-file-fixer
        exclude: '^home/private_dot_config/private_fcitx5/'
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-yaml
        exclude: '\.tmpl$'

  # Python の確実な誤りだけを見る (規則は ruff.toml)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check

  # GitHub Actions の設定の監査 (アクションの未固定・広すぎる権限など)
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor
