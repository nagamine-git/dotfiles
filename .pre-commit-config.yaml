repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ["-e", "SC1091,SC2016,SC2155"]
        exclude: '\.tmpl$'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # hazkey の .tsv は行末のタブが空の列を表すので消さない
      - id: trailing-whitespace
        exclude: '\.(md|tsv)$'
      # fcitx5 は設定を末尾の空行付きで書き戻すので、そろえると apply のたびに差分が出る
      - id: end-of-file-fixer
        exclude: '^home/private_dot_config/private_fcitx5/'
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-yaml
        exclude: '\.tmpl$'
