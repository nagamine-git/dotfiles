# サイドバーのエージェント行に出す「電波アイコンとワークスペース名」($signal_workspace) を、エージェントの状態と名前から作るローカルプラグイン。
# 対応表は private_dot_config/herdr/config.toml の [ui.sidebar.agents] のコメントと、signal.sh を揃えて直す。
# 登録は run_onchange_after_herdr-plugins.sh.tmpl
id = "nagamine.agent-signal"
name = "Agent signal"
version = "0.2.0"
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]

# server の起動 / 引き継ぎ後に、いるエージェント全員の表示を作り直す
[[startup]]
command = ["sh", "signal.sh", "sync"]

[[events]]
on = "pane.agent_status_changed"
command = ["sh", "signal.sh", "sync"]

# 新しく検出されたエージェントにも、状態が変わる前から出す
[[events]]
on = "pane.agent_detected"
command = ["sh", "signal.sh", "sync"]

# ワークスペースの名前の変更
[[events]]
on = "workspace.renamed"
command = ["sh", "signal.sh", "sync"]

# 別のワークスペースへ移ったペイン
[[events]]
on = "pane.moved"
command = ["sh", "signal.sh", "sync"]

# 手動で名前を付けていないワークスペースの名前は cwd で変わるが、herdr はそのイベントを出さない。
# 次の状態変化を待たず、フォーカスの移動でも追いつく
[[events]]
on = "pane.focused"
command = ["sh", "signal.sh", "sync"]
