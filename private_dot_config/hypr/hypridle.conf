general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

listener {
    timeout = 300                         # 5分
    on-timeout = loginctl lock-session    # ロック
}

listener {
    timeout = 330                         # 5.5分
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && sleep 0.5
}

# 2026-08-26: AFK suspend (30分 timeout → idle-sleep.sh) を恒久的に廃止。
# ユーザー明示指示により、room-telemetry の「夜間スリープ継続が正解」判断を上書き。
# 上のロック(5分)と dpms off(5.5分)は引き続き有効で、止めたのは suspend/hibernate だけ。
# 呼び先だった idle-sleep.sh と、毎晩02:00の nightly-suspend 一式も削除済み。

# 2026-09-29: 無操作の印 (5 分)。room-telemetry の在室 («操作していれば在室») と
# Baseline のピラミッドの «集中» が読む (~/.local/state/baseline-pyramid/idle.log)。
# 動画の再生などの抑止で止まらないよう、この listener だけ ignore_inhibit (ロックは今までどおり)。
listener {
    timeout = 300
    ignore_inhibit = true
    on-timeout = /usr/bin/python3 /home/tsuyoshi/.local/share/baseline-pyramid/pyramid_push.py --mark idle
    on-resume = /usr/bin/python3 /home/tsuyoshi/.local/share/baseline-pyramid/pyramid_push.py --mark active
}
