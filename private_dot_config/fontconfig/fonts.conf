<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- 元の Apple Color Emoji は数字・スペースの字形を持ち、Chrome で Luma などの数字が消えるため除外する。
       代わりに run_onchange_after_apple-emoji-text-safe.sh が作る ~/.local/share/fonts の複製
       (同じ "Apple Color Emoji" の名前で、U+0000-00FF の割り当てだけ外したもの) を使う -->
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/apple-color-emoji/*</glob>
    </rejectfont>
  </selectfont>

  <match target="font">
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>

    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>

    <edit name="rgba" mode="assign">
      <const>rgb</const>
    </edit>

    <edit name="lcdfilter" mode="assign">
      <const>lcddefault</const>
    </edit>
  </match>
</fontconfig>
