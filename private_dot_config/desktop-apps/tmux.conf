set -s exit-empty on
set -g remain-on-exit off
set -g update-environment "DISPLAY WAYLAND_DISPLAY DBUS_SESSION_BUS_ADDRESS XDG_RUNTIME_DIR XDG_CONFIG_HOME XDG_DATA_HOME XDG_CACHE_HOME XDG_STATE_HOME XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_ID HYPRLAND_INSTANCE_SIGNATURE SSH_AUTH_SOCK XCURSOR_SIZE XCURSOR_THEME QT_QPA_PLATFORM QT_SCALE_FACTOR GDK_BACKEND GTK_THEME ELECTRON_OZONE_PLATFORM_HINT LIBVA_DRIVER_NAME GBM_BACKEND __GLX_VENDOR_LIBRARY_NAME"
