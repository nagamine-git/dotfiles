name: chezmoi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  template-check:
    name: Template & syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin

      - name: Stub 1Password CLI (op)
        run: |
          sudo tee /usr/local/bin/op >/dev/null <<'EOF'
          #!/bin/bash
          # Stub for CI — return dummy value (no newline) for any onepasswordRead lookup
          printf 'STUB_SECRET_VALUE'
          EOF
          sudo chmod +x /usr/local/bin/op

      - name: Verify agent lifecycle without model calls
        run: |
          bash -n dot_local/bin/executable_agent-gateway dot_local/bin/executable_claude-statusline
          shellcheck dot_local/bin/executable_agent-gateway dot_local/bin/executable_claude-statusline
          python3 tests/agent-lifecycle.py

      - name: Verify shared agent config (Claude Code / Codex) without model calls
        run: |
          python3 tests/agents-sync.py
          python3 tests/agent-memory-dir.py
          python3 tests/codex-config.py

      - name: Verify model routing without credentials, network, or model calls
        run: |
          python3 -B tests/model-route-plan.py
          python3 -B tests/model-route.py
          python3 -B tests/cc-implement.py

      - name: Verify Slack bot logic without network or model calls
        run: |
          python3 tests/slack-claude.py
          python3 tests/slack-notify.py

      - name: Verify herdr agent summary hook with stubbed claude/herdr
        run: |
          shellcheck -S warning dot_claude/hooks/executable_herdr-agent-summary.sh dot_claude/hooks/executable_herdr-tab-title.sh
          python3 tests/herdr-agent-summary.py

      - name: Verify herdr helpers with stubbed tools
        run: |
          python3 tests/herdr-git-diff.py
          python3 tests/hgh.py

      - name: Verify notifications and desktop launch with stubbed tools
        run: |
          bash -n dot_local/bin/executable_chatgpt-launch
          shellcheck dot_local/bin/executable_chatgpt-launch
          python3 tests/claude-notify.py
          python3 tests/desktop-autostart.py
          python3 tests/chatgpt-launch.py

      - name: Install Node 24 (tests/jev-gate.py loads the TypeScript extension by stripping its types)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Pi wrapper and jev gate with stubbed tools (no keys, no model calls)
        run: |
          bash -n dot_local/bin/executable_pi-jev
          shellcheck dot_local/bin/executable_pi-jev
          python3 tests/pi-jev.py
          node --version
          # With CI set, an old Node fails this step instead of skipping it.
          python3 tests/jev-gate.py

      - name: Verify Vicinae launcher config and Meet script with stubbed tools
        run: |
          shellcheck dot_local/share/vicinae/scripts/executable_meet-join.sh
          python3 tests/vicinae.py

      - name: Verify chezmoi source state
        run: |
          # doctor は診断ログ目的のみ (CI 環境では常に一部失敗するため非ブロッキング)
          chezmoi --source="$GITHUB_WORKSPACE" doctor || true
          chezmoi --source="$GITHUB_WORKSPACE" execute-template '{{ "ok" }}'

      - name: Dry-run apply (template rendering)
        run: |
          mkdir -p /tmp/chezmoi-dest
          chezmoi --source="$GITHUB_WORKSPACE" \
                  --destination=/tmp/chezmoi-dest \
                  apply --dry-run --verbose 2>&1 | tail -50 || \
            (echo "::error::chezmoi apply dry-run failed" && exit 1)

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        env:
          SHELLCHECK_OPTS: -e SC1091,SC2016,SC2155
        with:
          # Fail only on real errors. Pre-existing style/warning findings across
          # the repo kept this gate permanently red (main has been failing since
          # 2026-05-29), so the default severity made the check meaningless.
          severity: error
          ignore_paths: >-
            etc
          scandir: .
