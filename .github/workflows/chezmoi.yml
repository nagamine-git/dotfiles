name: chezmoi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  template-check:
    name: Template & syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin

      - name: Stub 1Password CLI (op)
        run: |
          sudo tee /usr/local/bin/op >/dev/null <<'EOF'
          #!/bin/bash
          # Stub for CI — return dummy value (no newline) for any onepasswordRead lookup
          printf 'STUB_SECRET_VALUE'
          EOF
          sudo chmod +x /usr/local/bin/op

      - name: Install Node 24 (tests/jev-gate.py loads the TypeScript extension by stripping its types)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install zsh (Pi's shell; tests/pi-jev.py and tests/pi-settings.py run the real one)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zsh

      - name: Shell syntax of the scripts the tests drive
        run: |
          scripts="home/dot_local/bin/executable_agent-gateway home/dot_local/bin/executable_claude-statusline
            home/dot_local/bin/executable_chatgpt-launch home/dot_local/bin/executable_claude-notify home/dot_local/bin/executable_pi-jev
            home/dot_local/share/vicinae/scripts/executable_meet-join.sh"
          bash -n $scripts
          shellcheck $scripts
          shellcheck -S warning home/dot_claude/hooks/executable_herdr-agent-summary.sh home/dot_claude/hooks/executable_herdr-tab-title.sh

      # 全テストを回す (列挙すると足し忘れる: 2026-11 時点で 7 本が CI で走っていなかった)。
      # テストは鍵・ネットワーク・モデル呼び出しを使わない。unittest.main を持たないファイル (pi_real.py などの補助) は飛ばす。
      # CI が設定されていると、古い Node は jev-gate のテストを飛ばさず失敗させる。Pi 本体が要る確認は Pi の無い CI では飛ぶ
      - name: Run every test (no keys, network or model calls)
        shell: bash
        run: |
          fail=0
          for t in tests/*.py; do
            grep -q 'unittest.main' "$t" || continue
            echo "::group::$t"
            python3 -B "$t" || { echo "::error file=$t::$t failed"; fail=1; }
            echo "::endgroup::"
          done
          exit "$fail"

      - name: Verify chezmoi source state
        run: |
          # doctor は診断ログ目的のみ (CI 環境では常に一部失敗するため非ブロッキング)
          chezmoi --source="$GITHUB_WORKSPACE" doctor || true
          chezmoi --source="$GITHUB_WORKSPACE" execute-template '{{ "ok" }}'

      - name: Dry-run apply (template rendering)
        shell: bash
        run: |
          mkdir -p /tmp/chezmoi-dest
          chezmoi --source="$GITHUB_WORKSPACE" \
                  --destination=/tmp/chezmoi-dest \
                  apply --dry-run --verbose 2>&1 | tail -50 || \
            (echo "::error::chezmoi apply dry-run failed" && exit 1)

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        env:
          SHELLCHECK_OPTS: -e SC1091,SC2016,SC2155
        with:
          # Fail only on real errors. Pre-existing style/warning findings across
          # the repo kept this gate permanently red (main has been failing since
          # 2026-05-29), so the default severity made the check meaningless.
          severity: error
          ignore_paths: >-
            system/etc
          scandir: .
